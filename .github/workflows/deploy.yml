name: VibeCheck CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Build React Frontend
        run: |
          npm ci
          npm run build
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Python Dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          
      - name: Build Docker Container
        run: |
          docker build -t vibecheck-app:latest .
