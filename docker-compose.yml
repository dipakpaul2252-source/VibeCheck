version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PINECONE_API_KEY=${PINECONE_API_KEY:-mock-pinecone-key}
      - PINECONE_ENV=${PINECONE_ENV:-us-east-1}
      - PINECONE_INDEX=${PINECONE_INDEX:-vibecheck-embeddings}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-mock-openai-key}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_mock_stripe_key}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-whsec_mock_key}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-xoxb-mock-token}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET:-mock-signing-secret}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always
